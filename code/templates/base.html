
{% load static %}
<!doctype html>
<html lang="pt-br" data-bs-theme="light">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>{% block title %}EVENTA{% endblock %} · EVENTA</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <link rel="stylesheet" href="{% static 'css/eventa.css' %}">

    {% block extra_css %}{% endblock %}
</head>

<body class="d-flex flex-column min-vh-100">

    {% include "includes/navbar.html" %}

    <main class="flex-grow-1">

        <div class="container">
            {% include "includes/mensagens.html" %}
        </div>

        <div class="{% block content_container_class %}container py-4{% endblock %}">
            {% block content %}{% endblock %}
        </div>

    </main>

    <footer class="border-top py-3 text-center text-body-secondary small">
        EVENTA · Gestão de eventos e venda de ingressos
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    {% block extra_js %}{% endblock %}

</body>
</html>
