{% load static %}
<div class="card h-100 shadow-sm card-evento">
  <a href="{% url 'eventos:detalhe' evento.pk %}">
    <img src="{% if evento.foto %}{{ evento.foto.url }}{% else %}{% static 'img/evento-padrao.svg' %}{% endif %}"
         class="card-img-top object-fit-cover" style="aspect-ratio: 4 / 3;" alt="Foto do evento {{ evento.nome }}">
  </a>
  <div class="card-body d-flex flex-column">
    <p class="text-body-secondary small mb-1">
      {{ evento.data|date:"d/m/Y" }} · {{ evento.horario|time:"H:i" }}
    </p>
    <h2 class="h5 card-title">
      <a href="{% url 'eventos:detalhe' evento.pk %}" class="stretched-link text-decoration-none text-reset">{{ evento.nome }}</a>
    </h2>
    <p class="card-text text-body-secondary small mb-3">{{ evento.local }}</p>
    <p class="mt-auto mb-0 fw-semibold">
      {% if evento.preco_minimo is not None %}
        A partir de R$ {{ evento.preco_minimo|floatformat:2 }}
      {% else %}
        Ingressos em breve
      {% endif %}
    </p>
  </div>
</div>
